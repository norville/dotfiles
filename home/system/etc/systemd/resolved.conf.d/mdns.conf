# Managed by chezmoi (run_onchange_after_14-config-system.sh.tmpl).
# Disable systemd-resolved's own mDNS responder so it doesn't contend with Avahi
# for the mDNS socket ("Detected another IPv4 mDNS stack"). Deployed ONLY when
# Avahi is the active mDNS stack — on a machine without Avahi this would remove
# .local resolution entirely, so the script gates on avahi-daemon being active.
[Resolve]
MulticastDNS=no
