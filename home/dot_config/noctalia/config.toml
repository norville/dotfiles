[notification]
background_opacity = 0.65
monitors = [ "DP-1" ]

[osd]
background_opacity = 0.65

    [osd.kinds]
    media = false

[plugins]
enabled = [ "rylos/syncthing" ]

[shell]
avatar_path = "/home/norville/.face"
clipboard_keep_from_closed_apps = false
polkit_agent = true
show_location = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = true
    size = 12

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Tokyo-Night"
custom_palette = "tokyonight_moon"
mode = "auto"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper.default]
path = "/home/norville/Pictures/Wallpapers/primary.jpg"

[wallpaper.last]
path = "/home/norville/Pictures/Wallpapers/secondary.jpg"

[wallpaper.monitors.DP-1]
path = "/home/norville/Pictures/Wallpapers/primary.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/norville/Pictures/Wallpapers/secondary.jpg"

[widget.active_window]
capsule = true
capsule_opacity = 0.65
max_length = 800

[widget.bar]
type = "rylos/syncthing:bar"

[widget.clock]
capsule = true
capsule_opacity = 0.65
font_family = "JetBrains Mono"
format = "%a•%d %H:%M"

[widget.cpu]
font_family = "JetBrains Mono"
show_value = false
visualization = "gauge"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"
custom_image_colorize = true

[widget.media]
capsule = true
capsule_opacity = 0.65
hide_when_no_media = true
max_length = 600

[widget.network]
show_label = false

[widget.network_rx]
font_family = "JetBrains Mono"
network_speed_compact = true
show_value = false
visualization = "gauge"

[widget.network_tx]
font_family = "JetBrains Mono"
network_speed_compact = true
show_value = false
visualization = "gauge"

[widget.notifications]
hide_when_no_unread = false

[widget.privacy]
active_color = "error"
hide_inactive = false
icon_spacing = 6
inactive_color = "primary"

[widget.ram]
font_family = "JetBrains Mono"
show_value = false
visualization = "gauge"

[widget.session]
color = "error"

[widget.sysmon]
font_family = "JetBrains Mono"
show_value = false
stat = "disk_used_pct"
visualization = "gauge"

[widget.temp]
font_family = "JetBrains Mono"
show_value = false
visualization = "gauge"

[widget.tray]
capsule_opacity = 0.65

[widget.workspaces]
capsule = true
capsule_opacity = 0.65
empty_color = "shadow"
focused_output_only = true
font_weight = 700
labels_only_when_occupied = true
