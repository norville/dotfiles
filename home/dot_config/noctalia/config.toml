[audio]
sound_volume = 0.85

[backdrop]
blur_intensity = 0.25
tint_intensity = 0.0

[bar.default]
background_opacity = 0.5
capsule_opacity = 0.65
capsule_thickness = 0.75
center = [ "active_window" ]
end = [ "group:g1", "privacy", "clipboard", "notifications", "clock", "launcher", "control-center", "session" ]
margin_edge = 12
margin_ends = 12
padding = 12
start = [ "workspaces" ]

    [bar.default.monitor.HDMI-A-1]
    center = [ "media" ]
    end = [ "group:g1" ]
    scale = 0.9
    start = [ "workspaces" ]
    thickness = 28

        [[bar.default.monitor.HDMI-A-1.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "temp", "cpu", "ram", "sysmon", "network_rx", "network_tx" ]
        opacity = 0.65
        padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "tray", "bar" ]
    opacity = 0.65
    padding = 6.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.05
sync_all_monitors = true

[control_center]
hidden_tabs = [ "media", "calendar", "notifications", "screen-time" ]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "mic_mute"

[desktop_widgets]
enabled = false

[hooks]
session_locked = "1password --lock"
session_unlocked = "1password --quick-access"
started = "1password --silent"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = "Alessandria, IT"

[lockscreen]
fingerprint = false
monitors = []

