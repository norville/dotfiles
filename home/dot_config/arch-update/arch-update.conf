# =============================================================================
# arch-update / cachy-update configuration (~/.config/arch-update/arch-update.conf)
# =============================================================================
# cachy-update is a symlink to arch-update, which reads this file (the name is
# always "arch-update", even via the cachy-update symlink).
#
# AURHelper pins the helper used for AUR package support. arch-update's
# auto-detection order is paru → yay → pikaur, so paru is already chosen here;
# it is pinned explicitly so AUR support never silently falls back (or breaks)
# if another helper is installed later. paru is this repo's sole AUR helper —
# see dot_config/paru/paru.conf and ARCHITECTURE.md § "The AUR bootstrap".
#
# All other options are left at their defaults. See the full list in
# `/usr/share/arch-update/config/arch-update.conf.example` and arch-update.conf(5).
# =============================================================================

AURHelper=paru
