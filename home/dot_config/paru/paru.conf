# =============================================================================
# paru — AUR helper configuration (~/.config/paru/paru.conf)
# =============================================================================
# paru is the AUR helper on all Arch-based distros here (CachyOS's default);
# it replaced yay. Unlike yay's JSON config.json, paru reads a pacman.conf-style
# INI file: an [options] section of boolean flags (just the key) and `Key = value`
# settings, plus an optional [bin] section for external command overrides.
#
# Only non-default settings are listed below — paru's own defaults (PgpFetch,
# Provides, the -git/-svn/... devel suffixes) are left implicit. The clone/build
# dir is left at paru's default (~/.cache/paru/clone), which already keeps build
# artifacts under XDG cache, so it is not restated here.
#
# Docs: paru.conf(5) — https://github.com/Morganamilo/paru
# =============================================================================

[options]
# Print search results bottom-to-top with AUR results first (yay: bottomup).
BottomUp

# Remove the cloned build tree once a package is built (yay: cleanAfter).
CleanAfter

# Upgrade repo and AUR packages in a single transaction, so `paru -Syu` is a
# true drop-in for `pacman -Syu` (yay: combinedupgrade).
CombinedUpgrade

# Remove make-only dependencies after a successful build (yay: removemake=yes).
RemoveMake
