# Strip SHLVL from niri's environment so terminals start at a clean level.
#
# niri-session re-execs itself through a login shell (`exec -l $SHELL …`) to
# load the profile, which sets SHLVL=1, then `systemctl --user import-environment`
# copies that SHLVL=1 into the systemd --user manager env. niri.service inherits
# it, and every terminal niri spawns (app-niri-sh-*.scope) carries SHLVL=1, so
# the login shell lands on SHLVL=2 — making starship's shlvl module draw one
# spurious ❯. UnsetEnvironment= is applied after the manager env is inherited,
# so this removes SHLVL for niri and everything it spawns.
[Service]
UnsetEnvironment=SHLVL
